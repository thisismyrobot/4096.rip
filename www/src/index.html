<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>4096.rip - BiLock FG Key Profile Generator</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">
	<main class="container min-vh-100 d-flex align-items-center justify-content-center">
		<div class="w-100 mb-5" style="max-width: 640px">
			<div class="text-center mb-4">
				<h1 class="display-6 fw-semibold mb-2">BiLock FG Key Profile Generator</h1>
				<p class="text-secondary mb-0">Enter the left and right profiles, separated by a space.</p>
			</div>

			<form action="#" method="get" class="d-flex justify-content-center">
				<div class="input-group input-group-lg shadow-sm">
					<input type="text" class="form-control" name="q" placeholder="Enter the profiles like: 121212 343434" aria-label="Enter profiles">
					<button class="btn btn-primary" type="submit">Generate</button>
				</div>
			</form>

            <div id="stl-files" class="mt-4 text-center bordered hidden">
                <h2 class="h5 mb-3">STL Files</h2>
                <div id="stl-container" class="row g-3">
                    <div class="col-12 col-md-4 text-center">
                        <div class="stl-viewer bordered" id="stl-left"></div>
                        <a href="#"></a>
                    </div>
                    <div class="col-12 col-md-4 text-center">
                        <div class="stl-viewer bordered" id="stl-right"></div>
                        <a href="#"></a>
                    </div>
                    <div class="col-12 col-md-4 text-center">
                        <div class="stl-viewer bordered" id="stl-holder"></div>
                        <a href="#"></a>
                    </div>
                </div>
            </div>
		</div>
	</main>
	<script src="vendor/stl_viewer.min.js"></script>
	<script src="script.js"></script>
    <script>
        const form = document.querySelector('form')
        const inputField = form.querySelector('input[name="q"]')
        const submitButton = form.querySelector('button[type="submit"]')
        const stlPane = document.getElementById('stl-files')

        inputField.addEventListener('input', function (event) {
            stlPane.classList.add('hidden')
            const input = event.target.value.trim()
            const profiles = input.split(' ')
            submitButton.disabled = !generator.validateProfiles(profiles)
        })

        form.addEventListener('submit', function (event) {
            event.preventDefault()
            const input = inputField.value.trim()
            const profiles = input.split(' ')
            if (!generator.validateProfiles(profiles)) {
                stlPane.classList.add('hidden')
                alert('Please enter 2 valid profiles, containing only 6 numbers between 1 and 4, separated by a space.')
                return
            }
            stlPane.classList.remove('hidden')
            generator.generate(...profiles)
        })

        if (!generator.validateProfiles(inputField.value.trim().split(' '))) {
            submitButton.disabled = true
        }
    </script>
</body>
</html>
